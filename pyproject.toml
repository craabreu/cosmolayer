[build-system]
requires = ["setuptools", "versioningit"]
build-backend = "setuptools.build_meta"

# Self-descriptive entries which should always be present
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
[project]
name = "cosmolayer"
description = "Differentiable COSMO-Type Activity Coefficient Layer"
dynamic = ["version"]
readme = "README.md"
authors = [
    { name = "Charlles Abreu", email = "craabreu@gmail.com" }
]
license = { text = "MIT" }
# See https://pypi.org/classifiers/
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
# Declare any run-time dependencies that should be installed with the package.
dependencies = [
    "cmap",
    "lightning",
    "networkx",
    "numpy",
    "open3d",
    "opt-einsum",
    "pandas",
    "periodictable",
    "pyarrow",
    "pyyaml",
    "rdkit",
    "threadpoolctl",
    "torch",
    "tqdm",
]
# Note: "tqdm" above already covers cosmolayer.store._chalcedon's
# progress bars (disabled by default in library use); see that
# subpackage's NOTICE for provenance.

[project.scripts]
cosmoviz = "cosmolayer.cosmosac.visualize:main"
cosmostore = "cosmolayer.store.__main__:main"

[project.urls]
"Source" = "https://github.com/craabreu/cosmolayer/"
"Documentation" = "https://craabreu.github.io/cosmolayer/latest"

[project.optional-dependencies]
test = [
  "pytest>=6.1.2",
  "pytest-runner"
]

[tool.setuptools]
# This subkey is a beta stage development and keys may change in the future, see https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html for more details
#
# Keep type hints available to downstream type checkers (including mypy) that
# cannot read PEP 561 data from zipped eggs.
zip-safe = false
# Let setuptools discover the package in the current directory,
# but be explicit about non-Python files.
# See also:
#   https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html#setuptools-specific-configuration
# Note that behavior is currently evolving with respect to how to interpret the
# "data" and "tests" subdirectories. As of setuptools 63, both are automatically
# included if namespaces is true (default), even if the package is named explicitly
# (instead of using 'find'). With 'find', the 'tests' subpackage is discovered
# recursively because of its __init__.py file, but the data subdirectory is excluded
# with include-package-data = false and namespaces = false.
include-package-data = false
[tool.setuptools.packages.find]
namespaces = false
where = ["."]

# Ref https://setuptools.pypa.io/en/latest/userguide/datafiles.html#package-data
[tool.setuptools.package-data]
cosmolayer = [
    "py.typed",
    "data/*.csv",
    "data/*.cosmo",
    "data/*.json",
]

[tool.versioningit]
default-version = "0+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
# The method key:
method = "git"  # <- The method name
# Parameters to pass to the method:
match = ["v*"]
default-tag = "0.0.0"

[tool.versioningit.write]
file = "cosmolayer/_version.py"

[tool.ruff]
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "_build",
    "build",
    "dist",
    "*.egg-info",
    "devtools/**",
    "docs/**",
    ".github/**",
    "cosmolayer/store/_chalcedon/**",
]
extend-exclude = ["_version.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "PL",   # pylint
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ANN",  # flake8-annotations: require full signatures (mirrors old mypy disallow_untyped_defs)
]
# Note: E203 and W503 are not needed - ruff is compatible with black formatting by default

[tool.ruff.lint.pylint]
max-locals = 15
max-args = 6  # Allow up to 6 arguments in function definitions

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]
staticmethod-decorators = ["staticmethod"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = false  # require an explicit `-> None` on __init__, same as mypy strict did

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"**/tests/**/*.py" = ["PLR2004"]  # Allow magic values in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v -ra --doctest-modules --cov=cosmolayer --cov-report=term --cov-report=html"
testpaths = ["cosmolayer"]
markers = [
    "cuda: mark test as requiring a CUDA GPU",
]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.analysis]
# Optional COSMOSAC reference package: installed in test CI, not in the linter env.
allowed-unresolved-imports = ["cCOSMO"]

# Vendored third-party source (see cosmolayer/store/_chalcedon/NOTICE): kept
# as a clean diff against upstream, not held to this repo's typing bar.
# `ty check cosmolayer` passes the package as an explicit path, which bypasses
# src.exclude, so an override is required.
[[tool.ty.overrides]]
include = ["cosmolayer/store/_chalcedon/**"]

[tool.ty.overrides.rules]
all = "ignore"
